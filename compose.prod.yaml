# Production stack for Dokploy (service type: Docker Compose, compose path: ./compose.prod.yaml).
#
# Variables are defined in Dokploy's Environment tab. Dokploy writes them to a .env file next to
# this compose file and Compose interpolates the ${VAR} references below; nothing else is read.
# Required variables fail the deployment with a clear message when missing.
#
# Domain: add it in Dokploy's Domains tab for service "web", container port 8000, with HTTPS.
# Dokploy adds the Traefik labels and the network at deploy time, so no ports are published here.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-menuamano}
      POSTGRES_USER: ${POSTGRES_USER:-menuamano}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}
    volumes:
      # Named volume: required for Dokploy volume backups.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in Dokploy}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in Dokploy (e.g. menuamano.example.com)}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-true}
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-3600}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-menuamano}
      POSTGRES_USER: ${POSTGRES_USER:-menuamano}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}
      AI_PROVIDER: ${AI_PROVIDER:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-45}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-2}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-16000}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-low}
      SITE_URL: ${SITE_URL:-}
      # Owner details shown in the legal notice and privacy policy (placeholders if missing).
      LEGAL_OWNER_NAME: ${LEGAL_OWNER_NAME:-}
      LEGAL_OWNER_TAX_ID: ${LEGAL_OWNER_TAX_ID:-}
      LEGAL_OWNER_ADDRESS: ${LEGAL_OWNER_ADDRESS:-}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-}
      LEGAL_REGISTRY: ${LEGAL_REGISTRY:-}
      LEGAL_HOSTING_PROVIDER: ${LEGAL_HOSTING_PROVIDER:-}
      # Google Tag Manager: public pages only by default, with Consent Mode v2 and a consent banner.
      GTM_CONTAINER_ID: ${GTM_CONTAINER_ID:-GTM-WWR8DTN8}
      GTM_SCOPE: ${GTM_SCOPE:-public}
      COOKIE_CONSENT_BANNER: ${COOKIE_CONSENT_BANNER:-true}
      # Billing with Stripe. With BILLING_ENABLED=true (default) Django refuses to start without
      # STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_PRICE_MONTHLY and STRIPE_PRICE_YEARLY.
      BILLING_ENABLED: ${BILLING_ENABLED:-true}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_MONTHLY: ${STRIPE_PRICE_MONTHLY:-}
      STRIPE_PRICE_YEARLY: ${STRIPE_PRICE_YEARLY:-}
      STRIPE_AUTOMATIC_TAX: ${STRIPE_AUTOMATIC_TAX:-false}
      FREE_MAX_MEMBERS: ${FREE_MAX_MEMBERS:-2}
      PREMIUM_MAX_MEMBERS: ${PREMIUM_MAX_MEMBERS:-8}
      PREMIUM_AI_MONTHLY_LIMIT: ${PREMIUM_AI_MONTHLY_LIMIT:-150}
      PREMIUM_PRICE_MONTHLY_LABEL: ${PREMIUM_PRICE_MONTHLY_LABEL:-4,99 €}
      PREMIUM_PRICE_YEARLY_LABEL: ${PREMIUM_PRICE_YEARLY_LABEL:-49 €}
      # Email (password resets, invitations, error reports): Mailgun SMTP by default.
      # Django refuses to start if the chosen provider lacks its credentials.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.mailgun.org}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-}
      # Only with EMAIL_PROVIDER=mailgun (HTTP API).
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_SENDER_DOMAIN: ${MAILGUN_SENDER_DOMAIN:-}
      MAILGUN_API_URL: ${MAILGUN_API_URL:-https://api.mailgun.net/v3}
      MAILGUN_WEBHOOK_SIGNING_KEY: ${MAILGUN_WEBHOOK_SIGNING_KEY:-}
      ANYMAIL_WEBHOOK_SECRET: ${ANYMAIL_WEBHOOK_SECRET:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?Set DEFAULT_FROM_EMAIL in Dokploy (e.g. menuamano <no-reply@mg.example.com>)}
      SERVER_EMAIL: ${SERVER_EMAIL:-}
      DJANGO_ADMINS: ${DJANGO_ADMINS:-}
      EMAIL_TIMEOUT_SECONDS: ${EMAIL_TIMEOUT_SECONDS:-15}
    command: >-
      sh -c "python manage.py migrate --noinput
      && python manage.py collectstatic --noinput
      && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-3} --timeout 90 --access-logfile -"
    expose:
      - "8000"
    healthcheck:
      # /healthz skips the HTTPS redirect and host validation and checks the database connection.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
