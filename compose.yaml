# Local development stack. Not intended for public deployment (see compose.prod.yaml).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: menuamano
      POSTGRES_USER: menuamano
      POSTGRES_PASSWORD: menuamano
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound to localhost only; handy for running tests from a local virtualenv.
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menuamano -d menuamano"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
